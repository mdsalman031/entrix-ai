[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entrix-ai"
version = "0.1.0"
description = "Enterprise Intelligence & Agentic Automation Platform — Research-grade permission-aware RAG with evidence sufficiency control"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.10.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",  # compatible with passlib 1.7.x on the supported Python baseline
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "structlog==24.4.0",
    "rank-bm25==0.2.2",
    "numpy==2.2.6",
    "qdrant-client==1.12.1",
    "sentence-transformers==3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
]
llm = [
    "openai>=1.55.0",
    "anthropic>=0.39.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # FastAPI uses Depends(...) in endpoint signatures.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
